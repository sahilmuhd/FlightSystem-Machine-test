<!DOCTYPE html>
<html>
<head>
    <title>Add Airport Route</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="text-center mb-4">➕ Add Airport Route</h2>

    <form method="POST" class="card p-4 shadow-sm bg-white">
        {% csrf_token %}

        <!-- Display form fields with errors -->
        {% for field in form %}
            <div class="mb-3">
                {{ field.label_tag }}
                {{ field }}
                {% if field.errors %}
                    {% for error in field.errors %}
                        <div class="text-danger small">{{ error }}</div>
                    {% endfor %}
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary w-100">Add Route</button>
    </form>

    <!-- Success message -->
    {% if message %}
        <div class="alert alert-success mt-3 text-center">{{ message }}</div>
    {% endif %}

    <a href="/" class="btn btn-secondary mt-3">← Back to Home</a>
</div>

</body>
</html>
