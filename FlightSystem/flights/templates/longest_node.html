<!DOCTYPE html>
<html>
<head>
    <title>Longest Node</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="text-center mb-4">⏱ Longest Node (Based on Duration)</h2>

    {% if longest %}
        <div class="card shadow-sm p-4 bg-white">
            <h5 class="mb-3">✈️ Airport Route Details</h5>
            <p><strong>Airport Code:</strong> {{ longest.airport_code }}</p>
            <p><strong>Position:</strong> {{ longest.position }}</p>
            <p><strong>Duration:</strong> {{ longest.duration }} mins</p>
        </div>
    {% else %}
        <div class="alert alert-danger mt-3 text-center">No routes found!</div>
    {% endif %}

    <a href="/" class="btn btn-secondary mt-4">← Back to Home</a>
</div>

</body>
</html>
